name: Rollback
on:
  workflow_dispatch:
    inputs:
      aws_release:
        description: "AWS release to serve (empty = the one before the active release)"
        required: false
        default: ""

env:
  NODE_VERSION: "24.15.0"

jobs:
  rollback:
    name: Rollback
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Checkout previous tag
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          echo "Rolling back to $PREVIOUS_TAG"
          git checkout $PREVIOUS_TAG

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/browser
          cname: vgcmulticalc.com
          user_name: robsonbittencourt
          user_email: robson.luizv@gmail.com

  rollback-aws:
    name: Rollback AWS
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_DEPLOY_ROLE: arn:aws:iam::377985789099:role/vgcmulticalc-github-deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Switch to previous release
        env:
          AWS_RELEASE: ${{ inputs.aws_release }}
        run: scripts/aws/rollback-site.sh "$AWS_RELEASE"
