name: Rollback
on:
  workflow_dispatch:
    inputs:
      aws_release:
        description: "AWS release to serve (empty = the one before the active release)"
        required: false
        default: ""

env:
  NODE_VERSION: "24.15.0"

jobs:
  rollback:
    name: Rollback
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE }}
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
      ACTIVE_RELEASE_PARAMETER: ${{ vars.ACTIVE_RELEASE_PARAMETER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Switch to previous release
        env:
          AWS_RELEASE: ${{ inputs.aws_release }}
        run: scripts/aws/rollback-site.sh "$AWS_RELEASE"
