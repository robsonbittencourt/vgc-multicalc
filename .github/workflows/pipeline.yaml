name: Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

env:
  NODE_VERSION: "24.21.0"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload site build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: site-dist
          path: ./dist/browser
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test-coverage

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-reports
          path: |
            ./coverage/vgc-multicalc/lcov.info
            ./coverage/vgc-multicalc/dashboard.html

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run check

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs:
      - build
      - unit-tests
      - lint

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download site build
        uses: actions/download-artifact@v8.0.1
        with:
          name: site-dist
          path: ./dist/browser

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate preview assets
        run: npm run og-assets

      - name: Install paste server dependencies
        run: npm ci --prefix infra/modules/pastes/lambda

      - name: Cypress run
        uses: cypress-io/github-action@v7.4.6
        with:
          install: false
          start: npm run server
          wait-on: "http://localhost:4200"
          browser: chrome

  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs: e2e-tests
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE }}
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
      ACTIVE_RELEASE_PARAMETER: ${{ vars.ACTIVE_RELEASE_PARAMETER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download site build
        uses: actions/download-artifact@v8.0.1
        with:
          name: site-dist
          path: ./dist/browser

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to AWS
        run: scripts/aws/deploy-site.sh

  release:
    name: Release
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs: deploy
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          chmod +x release-notes-generator.sh
          NOTES=$(./release-notes-generator.sh)
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get current tag
        id: tag
        run: echo "TAG=$(git tag --sort=-creatordate | head -n 1)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view ${{ steps.tag.outputs.TAG }} > /dev/null 2>&1; then
            gh release create ${{ steps.tag.outputs.TAG }} \
              --title "${{ steps.tag.outputs.TAG }}" \
              --notes "${{ steps.notes.outputs.RELEASE_NOTES }}" \
              --latest
          fi

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs: deploy

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download Coverage Reports
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-reports

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
