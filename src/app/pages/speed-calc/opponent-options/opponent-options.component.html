<div class="options">
  <div class="speed-modifier">
    <app-input-select label="Speed Modifier" [value]="optionsStore.speedModifier().toString()" [allValues]="statsModifiers" (valueChange)="updateSpeedModifier($event)" data-cy="speed-calc-spe-modifier" />
  </div>

  <mat-button-toggle-group multiple class="button-group" [hideMultipleSelectionIndicator]="true">
    <mat-button-toggle [checked]="optionsStore.speedDropActive()" (change)="optionsStore.toggleIcyWind($event.source.checked)" data-cy="speed-calc-icy-wind">{{ "Icy Wind" | t }}</mat-button-toggle>
    <mat-button-toggle [checked]="optionsStore.paralyzedActive()" (change)="optionsStore.toggleParalyze($event.source.checked)" data-cy="speed-calc-paralyzed">{{ "Paralyzed" | t }}</mat-button-toggle>
    <mat-button-toggle [checked]="optionsStore.choiceScarfActive()" (change)="optionsStore.toggleChoiceScarf($event.source.checked)" data-cy="speed-calc-choice-scarf">{{ "Choice Scarf" | t }}</mat-button-toggle>
  </mat-button-toggle-group>
</div>
