<app-mobile-calc-shell [tabs]="tabs" [activeTab]="activeBottomTab()" (tabSelected)="onTabSelected($event)" [swipeDisabled]="overlay.isAnyOpen()" [bottomNavHidden]="!showBottomNav()">
  <div #scrollContainer class="scrollable-content" data-cy="scrollable-content" [class.table-open]="overlay.isAnyOpen()" [class.nav-hidden]="!showBottomNav()" (scroll)="onScroll($event)">
    <div class="team-tabs-sticky" [hidden]="overlay.isAnyOpen()">
      <div class="team-tabs" data-cy="side-tabs">
        @if (store.isEditingCustomSet()) {
          <div class="team-tab active-tab">
            <app-pokemon-sprite [name]="currentPokemon().name" />
          </div>
          <div class="team-tab add-tab" (click)="exitCustomSetEditMode()">
            <mat-icon>close</mat-icon>
          </div>
        } @else {
          <div class="team-tab" [ngClass]="{ 'active-tab': activeSide() === 'left' }" data-cy="side-tab-left" (click)="activateLeftPokemon()">
            <app-pokemon-sprite [name]="store.leftPokemon().name" />
          </div>
          <div class="team-tab" [ngClass]="{ 'active-tab': activeSide() === 'right' }" data-cy="side-tab-right" (click)="activateRightPokemon()">
            <app-pokemon-sprite [name]="store.rightPokemon().name" />
          </div>
        }
      </div>
    </div>

    <div class="attacker-header" [hidden]="overlay.kind() === 'moves' || overlay.kind() === 'abilities' || overlay.kind() === 'items'">
      <app-pokemon-search-input
        #pokemonInput
        [value]="inputDisplay()"
        [searching]="overlay.kind() === 'pokemon'"
        ariaLabel="Pokémon"
        dataCy="pokemon-select"
        (pressed)="buildEditing.onPokemonMouseDown($event)"
        (cleared)="buildEditing.onPokemonClick()"
        (valueChanged)="buildEditing.filter($event)" />
      <div class="attacker-actions">
        @if (overlay.kind() === "pokemon") {
          <app-close-table-button data-cy="close-pokemon-table" (click)="onClosePokemonTable()" />
        } @else {
          <app-save-set-button [pokemonId]="currentPokemon().id" displayMode="button" (openPokemonTable)="overlay.open('pokemon')" />
          @if (!store.isEditingCustomSet()) {
            <app-import-pokemon-button (pokemonImportedEvent)="importPokemon($event)" />
          }
          <app-export-pokemon-button [pokemonId]="currentPokemon().id" />
        }
      </div>
    </div>

    @if (!overlay.isAnyOpen()) {
      <div class="set-name-row">
        <app-save-set-button [pokemonId]="currentPokemon().id" displayMode="name" [showMatchingSet]="true" (openPokemonTable)="overlay.open('pokemon')" />
      </div>
    }

    <div class="attacker-header" [hidden]="overlay.kind() !== 'items'">
      <app-pokemon-search-input
        #itemInput
        [value]="currentPokemon().item"
        [searching]="overlay.kind() === 'items'"
        ariaLabel="Item"
        dataCy="item-select"
        (pressed)="buildEditing.onItemMouseDown($event)"
        (cleared)="buildEditing.onItemClick()"
        (valueChanged)="buildEditing.filter($event)" />
      <div class="attacker-actions">
        <app-close-table-button data-cy="close-items-table" (click)="buildEditing.closeItemsTable()" />
      </div>
    </div>

    <div class="attacker-build">
      <app-pokemon-build-mobile
        [pokemonId]="currentPokemon().id"
        [showOptimization]="!isCurrentPokemonAttacker()"
        [showOffensiveOptimization]="isCurrentPokemonAttacker()"
        [optimizedEvs]="optimizedEvs()"
        [optimizedNature]="optimizedNature()"
        [optimizationStatus]="optimizationStatus()"
        [optimizationKoChance]="optimizationKoChance()"
        [optimizationImpossible]="optimizationImpossible()"
        [optimizationCoverage]="optimizationCoverage()"
        [showDelete]="false"
        [manageTeamState]="false"
        [isRightSide]="activeSide() === 'right'"
        [hideEvs]="overlay.isAnyOpen()"
        [hideMoves]="overlay.kind() === 'pokemon' || overlay.kind() === 'abilities' || overlay.kind() === 'items'"
        [editingMoves]="overlay.kind() === 'moves'"
        [stickyMoves]="!overlay.isAnyOpen()"
        [movesStuck]="movesStuck()"
        [editingAbility]="overlay.kind() === 'abilities'"
        [editingItem]="overlay.kind() === 'items'"
        (pokemonImportedEvent)="importPokemon($event)"
        (optimizationRequested)="handleOptimizeRequest($event)"
        (offensiveOptimizationRequested)="handleOffensiveOptimizeRequest($event)"
        (optimizationApplied)="handleOptimizationApplied()"
        (optimizationDiscarded)="handleOptimizationDiscarded()"
        (evsCleared)="handleEvsCleared()"
        (editMovesRequested)="buildEditing.openMovesTable()"
        (closeMovesRequested)="buildEditing.closeMovesTable()"
        (editAbilityRequested)="buildEditing.openAbilitiesTable()"
        (editItemRequested)="buildEditing.openItemsTable()" />

      <app-mobile-table-overlay [pokemonId]="currentPokemon().id" [moveIndex]="activeMoveIndex()" (tableSelect)="buildEditing.selectFromTable($event)" (customSetEditRequested)="onCustomSetEditRequested($event)" />
    </div>

    <div class="results-list" [hidden]="overlay.isAnyOpen()">
      <div class="result-card">
        <app-pokemon-card [damageResult]="damageResult()" [target]="target()" [rollLevelConfig]="rollLevelConfig()" [isAttacker]="isCurrentPokemonAttacker()" [collapsible]="false" [expanded]="true" (targetActivated)="activateRightPokemon()" />
      </div>

      <app-widget class="role-widget">
        <mat-button-toggle-group class="button-group" [value]="isCurrentPokemonAttacker() ? 'attacker' : 'defender'" (change)="toggleCurrentPokemonRole()">
          <mat-button-toggle value="attacker">Attacker</mat-button-toggle>
          <mat-button-toggle value="defender">Defender</mat-button-toggle>
        </mat-button-toggle-group>
      </app-widget>
    </div>
  </div>

  <div class="scrollable-content field-tab" data-cy="scrollable-content-field">
    <div class="widget-list">
      <div class="modifiers-title">Modifiers</div>
      <app-widget class="settings-widget">
        <div class="field-configs">
          <div class="roll-config-section">
            <app-roll-config [(config)]="rollLevelConfig" (rollLevelChange)="handleRollLevelChange($event)" />
          </div>
        </div>
      </app-widget>
      <app-field oneVsOne="true" />
    </div>
  </div>
</app-mobile-calc-shell>
