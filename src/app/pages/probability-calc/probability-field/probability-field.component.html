<app-widget [title]="'Field'">
  <div class="weather-buttons">
    <mat-button-toggle data-cy="probability-field-weather-sun" [checked]="fieldStore.isWeatherSun()" (change)="fieldStore.toggleSunWeather()">{{ "Sun" | t }}</mat-button-toggle>
    <mat-button-toggle data-cy="probability-field-weather-rain" [checked]="fieldStore.isWeatherRain()" (change)="fieldStore.toggleRainWeather()">{{ "Rain" | t }}</mat-button-toggle>
    <mat-button-toggle data-cy="probability-field-weather-sand" [checked]="fieldStore.isWeatherSand()" (change)="fieldStore.toggleSandWeather()">{{ "Sand" | t }}</mat-button-toggle>
    <mat-button-toggle data-cy="probability-field-weather-snow" [checked]="fieldStore.isWeatherSnow()" (change)="fieldStore.toggleSnowWeather()">{{ "Snow" | t }}</mat-button-toggle>
    <mat-button-toggle data-cy="probability-field-gravity" [checked]="fieldStore.isGravity()" (change)="fieldStore.toggleGravity()">{{ "Gravity" | t }}</mat-button-toggle>
  </div>
</app-widget>
