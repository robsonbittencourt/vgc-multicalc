<div [ngClass]="{ 'active-tab': selection() !== 'none', 'second-tab': selection() === 'second' }" class="tab" (click)="activateTab($event)" data-cy="team-member-tab">
  @if (isAddMode()) {
    <mat-icon data-cy="add-team-member-tab">add</mat-icon>
  } @else {
    <div class="sprite-wrapper">
      @if (itemSprite()) {
        <img class="item-icon" src="assets/sprites/items/{{ itemSprite() }}.webp" loading="lazy" alt="" data-cy="tab-item-icon" />
      }
      <app-pokemon-sprite [name]="pokemon().name" />
    </div>
    <label class="tab-label">{{ pokemon().displayNameWithoutSuffix }}</label>
    @if (hasDuplicateItem()) {
      <mat-icon
        #duplicateTooltip="matTooltip"
        class="duplicate-item-warning"
        matTooltip="This Pokémon is using an item already used by another Pokémon"
        matTooltipPosition="above"
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="2000"
        (click)="$event.stopPropagation(); duplicateTooltip.show()"
        data-cy="duplicate-item-warning"
        >warning</mat-icon
      >
    }
  }
</div>
