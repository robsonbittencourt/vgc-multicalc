<div class="roll-level">
  <label class="label">{{ "Roll Level" | t }}</label>
  <mat-button-toggle-group class="button-group" [hideSingleSelectionIndicator]="true" [disabled]="disabled()">
    <mat-button-toggle [checked]="config().low" (change)="activateLowRoll()" data-cy="low-roll">{{ "Low" | t }}</mat-button-toggle>
    <mat-button-toggle [checked]="config().medium" (change)="activateMediumRoll()" data-cy="medium-roll">{{ "Medium" | t }}</mat-button-toggle>
    <mat-button-toggle [checked]="config().high" (change)="activateHighRoll()" data-cy="high-roll">{{ "High" | t }}</mat-button-toggle>
  </mat-button-toggle-group>
</div>
