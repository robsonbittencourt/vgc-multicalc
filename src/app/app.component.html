@if (appReady()) {
  <app-announcement-popup
    title="What's New!"
    [items]="[
      {
        text: 'The SP Optimizer has been rebuilt with a new layout: a single sentence describes the goal, so you can see exactly what will be optimized before running it.',
        image: 'assets/media/sp-optimizer.png'
      },
      {
        text: 'It now optimizes offense too. Choose KO instead of Survive and it finds the fewest SPs needed to reach the KO you want on the target, including when two attackers hit together.'
      },
      {
        text: 'And when no spread can survive or reach the KO, the optimizer no longer gives up: it proposes a best effort spread and tells you how close you got.',
        image: 'assets/media/sp-optimizer-best-effort.png',
        textAfterMedia: true
      }
    ]"
    version="2026-09-22" />
}
